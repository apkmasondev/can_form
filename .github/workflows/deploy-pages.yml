name: Deploy CAN//FORM to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment that is already publishing; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # `npm run build` runs `tsc -b` first, so a type error fails the deploy
      # rather than shipping a broken bundle.
      - name: Build static site
        run: npm run build
        env:
          # configure-pages resolves the real published origin, including a
          # custom domain, so canonical/OG metadata is correct without anyone
          # having to remember to set a repository variable. An explicit
          # SITE_URL variable still wins if one is configured.
          VITE_SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
          VITE_BASE_PATH: ${{ vars.BASE_PATH }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
